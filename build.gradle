/// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    // 🎯 统一管理：AGP 8.13.2 (完美适配 Gradle 9.x 系列)
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    
    // ✅ 核心修复 1：使用 Kotlin 2.4.10。只有 2.4+ 才能认识并编译过手机端的 jvmTarget = '26'
    id 'org.jetbrains.kotlin.android' version '2.4.10' apply false
    
    // ✅ 核心修复 2：Compose 编译器插件的版本必须与上面的 Kotlin 插件版本【完全严格一致】
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
}

// 🟢 打印日志提示（更新日志信息，避免误导）
logger.warn("WearSync 编译提示: 根目录配置加载成功 (Kotlin 2.4.10 + AGP 8.13.2 -> 全面适配 JDK 26)")

// 现代化的 clean 任务写法（适配 Gradle 9.x）
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
