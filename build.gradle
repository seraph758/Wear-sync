/// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    // 🎯 统一管理：AGP 8.13.2 + Kotlin 2.1.20 (2026年最新稳定组合)
    id 'com.android.application' version '8.13.2' apply false
    id 'com.android.library' version '8.13.2' apply false
    
    // ✅ 核心修复1：升级 Kotlin 至 2.1.20，匹配 AGP 8.13.2 与 JDK 25
    id 'org.jetbrains.kotlin.android' version '2.1.20' apply false
    
    // ✅ 核心修复2：新增 Compose 编译器插件，版本必须与 kotlin.android 严格一致
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.20' apply false
}

// 🟢 打印日志提示
logger.warn("WearSync 编译提示: 根目录配置加载成功 (Kotlin 2.1.20 + AGP 8.13.2)")

// 现代化的 clean 任务写法（适配 Gradle 9.x）
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
