plugins {
    // 🎯 统一管理：AGP 9.4.0-alpha04
    id 'com.android.application' version '9.4.0-alpha04' apply false
    id 'com.android.library' version '9.4.0-alpha04' apply false

    // 🚫 核心清理：彻底删除了 id 'org.jetbrains.kotlin.android'，因为 AGP 9.0+ 会自动托管 Kotlin 编译

    // ✅ Compose 编译器插件依然需要，保持独立声明以匹配你的 Compose 运行时
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.10' apply false
}

// 🟢 打印日志提示
logger.warn("WearSync 编译提示: 根目录配置加载成功 (AGP 9.4 内置 Kotlin 支持 + Compose 2.4.10 -> 全面适配 JDK 26)")

// 现代化的 clean 任务写法（适配 Gradle 9.x）
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
