plugins {
    id 'com.android.application'
}

// ==================== 签名配置 ====================
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
def usePropertiesSigning = false
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { stream ->
        signingProps.load(stream)
    }
    usePropertiesSigning = true
}

def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"

android {
    namespace "cn.luke.wearsync"
    compileSdk = 37

    defaultConfig {
        applicationId "cn.luke.wearsync"
        minSdk = 35
        targetSdk = 37
        versionCode githubRunNumber.toInteger()
        versionName "1.0.${githubRunNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable += ['GradleDependency', 'NewerVersionAvailable', 'LockedOrientationActivity']
        checkReleaseBuilds = false
        abortOnError = false
    }

    signingConfigs {
        debugging {
            storeFile file('../debug.keystore')
            keyAlias 'androiddebugkey'
            storePassword 'android'
            keyPassword 'android'
        }
        release {
            if (usePropertiesSigning) {
                storeFile file(signingProps['STORE_FILE'])
                storePassword signingProps['STORE_PASSWORD']
                keyAlias signingProps['KEY_ALIAS']
                keyPassword signingProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugging
        }
        release {
            signingConfig usePropertiesSigning ? signingConfigs.release : signingConfigs.debugging
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // ✅ 目标平台设为 17
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        
        // ✅ 核心开启：允许将高版本语法脱糖翻译给低版本 Wear OS 运行
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        viewBinding true 
    }
}

// ✅ 锁定为 Java 17 特性
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--release', '17',           // 👈 锁定 release 级别为 17
        '-Xlint:deprecation', 
        '-Xlint:unchecked',
    ]
    options.deprecation = true
}

dependencies {
    // ==================== 核心脱糖依赖 ====================
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ==================== WearOS 专属组件 ====================
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'

    // ==================== AndroidX 基础组件 ====================
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core:1.16.0'

    // ✅ 【新增】显式声明 activity，确保 OnBackPressedCallback 可用
    // 纯 Java 版，不带 -ktx，不会引入 Kotlin 运行时
    implementation 'androidx.activity:activity:1.9.3'

    // ==================== Wearable 通讯底层 ====================
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'

    // ==================== LocalBroadcastManager ====================
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // ==================== Material ====================
    implementation 'com.google.android.material:material:1.9.0'

    // ==================== 测试依赖 ====================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}
