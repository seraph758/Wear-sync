plugins {
    id 'com.android.application'
    // ❌ 已移除 org.jetbrains.kotlin.android，纯 Java 项目不需要它
}

// ==================== 签名配置 ====================
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
def usePropertiesSigning = false
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { stream ->
        signingProps.load(stream)
    }
    usePropertiesSigning = true
}

def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"

android {
    namespace "cn.luke.wearsync"
    compileSdk = 36

    defaultConfig {
        applicationId "cn.luke.wearsync"
        minSdk = 35
        targetSdk = 36
        versionCode githubRunNumber.toInteger()
        versionName "1.0.${githubRunNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable += ['GradleDependency', 'NewerVersionAvailable', 'LockedOrientationActivity']
        checkReleaseBuilds = false
        abortOnError = false
    }

    signingConfigs {
        debugging {
            storeFile file('../debug.keystore')
            keyAlias 'androiddebugkey'
            storePassword 'android'
            keyPassword 'android'
        }
        release {
            if (usePropertiesSigning) {
                storeFile file(signingProps['STORE_FILE'])
                storePassword signingProps['STORE_PASSWORD']
                keyAlias signingProps['KEY_ALIAS']
                keyPassword signingProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugging
        }
        release {
            signingConfig usePropertiesSigning ? signingConfigs.release : signingConfigs.debugging
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // ✅ 目标平台统一调整为 21
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        
        // ✅ 核心开启：允许将高版本语法脱糖翻译给 Wear OS 6 运行
        coreLibraryDesugaringEnabled = true
    }

    // ========================================================
    // ❌ 彻底删除了原先内部的 java { toolchain { ... } } 块！
    // ========================================================

    buildFeatures {
        viewBinding true 
    }
}

// ========================================================
// ❌ 彻底删除了底部的 if (System.getenv("GITHUB_ACTIONS") == "true") 判定块！
// 手机本地与 GitHub 云端彻底摆脱 Foojay 联网下载工具，直接对齐默认环境。
// ========================================================

// ✅ 保持 Java 编译器的预览特性开启（让手表端 Java 代码顺利识别下划线 _ 语法）
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-Xlint:deprecation', 
        '-Xlint:unchecked',
        '--enable-preview'
    ]
    options.deprecation = true
}

dependencies {
    // ==================== 核心脱糖依赖 ====================
    // ✅ 必须引入此库，作为“翻译官”把高版本字节码重写为手表兼容的格式
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ==================== WearOS 专属组件 ====================
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'

    // ==================== AndroidX 基础组件 ====================
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    // 💡 提示：因为是纯 Java 项目，未来如果不需要这几个组件，可以把 -ktx 后缀去掉以减小包体积
    implementation 'androidx.preference:preference-ktx:1.2.1' 
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.16.0'

    // ==================== Wearable 通讯底层 ====================
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'

    // ==================== LocalBroadcastManager ====================
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // ==================== 测试依赖 ====================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
