plugins {
    id 'com.android.application'
}

// ==================== 签名配置 ====================
def signingPropsFile = rootProject.file('signing.properties')
def signingProps = new Properties()
def usePropertiesSigning = false
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { stream ->
        signingProps.load(stream)
    }
    usePropertiesSigning = true
}

def githubRunNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"

android {
    namespace "cn.luke.wearsync"
    compileSdk = 36

    defaultConfig {
        applicationId "cn.luke.wearsync"
        minSdk = 35
        targetSdk = 36
        versionCode githubRunNumber.toInteger()
        versionName "1.0.${githubRunNumber}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable += ['GradleDependency', 'NewerVersionAvailable', 'LockedOrientationActivity']
        checkReleaseBuilds = false
        abortOnError = false
    }

    signingConfigs {
        debugging {
            storeFile file('../debug.keystore')
            keyAlias 'androiddebugkey'
            storePassword 'android'
            keyPassword 'android'
        }
        release {
            if (usePropertiesSigning) {
                storeFile file(signingProps['STORE_FILE'])
                storePassword signingProps['STORE_PASSWORD']
                keyAlias signingProps['KEY_ALIAS']
                keyPassword signingProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugging
        }
        release {
            signingConfig usePropertiesSigning ? signingConfigs.release : signingConfigs.debugging
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // ✅ 目标平台设为 22
        sourceCompatibility JavaVersion.VERSION_22
        targetCompatibility JavaVersion.VERSION_22
        
        // ✅ 核心开启：允许将高版本语法脱糖翻译给低版本 Wear OS 运行
        coreLibraryDesugaringEnabled = true
    }

    buildFeatures {
        viewBinding true 
    }
}

// ✅ 核心修复：显式开启 Java 预览特性，确保支持 Java 22 的下划线（_）等新语法
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '--enable-preview',          // 👈 必须开启预览特性
        '--release', '22',           // 👈 锁定 release 级别为 22
        '-Xlint:deprecation', 
        '-Xlint:unchecked',
    ]
    options.deprecation = true
}

dependencies {
    // ==================== 核心脱糖依赖 ====================
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ==================== WearOS 专属组件 ====================
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-remote-interactions:1.2.0'

    // ==================== AndroidX 基础组件（纯 Java 优化版） ====================
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    
    // ✅ 优化：移除了 -ktx 后缀，改为纯 Java 依赖，防止把 Kotlin 运行时打包进手表导致安装包激增
    implementation 'androidx.preference:preference:1.2.1' 
    implementation 'androidx.core:core:1.16.0'

    // ==================== Wearable 通讯底层 ====================
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'

    // ==================== LocalBroadcastManager ====================
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // ==================== 测试依赖 ====================
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
